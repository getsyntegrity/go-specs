# Dependabot targets develop, not this repo's default branch behaviour: every feature, fix and
# dependency bump lands on develop first (CONTRIBUTING.md's Branching Model), and main only moves
# through a develop -> main release/hotfix PR, so an update PR opened against main would sit
# outside that flow and never get released the ordinary way.
#
# Both ecosystems group their own minor and patch updates into a single PR, leaving major bumps
# ungrouped -- a major version can carry a breaking change worth reviewing (and bisecting, if it
# regresses something) on its own, while a minor/patch bump is routine enough that one PR per
# dependency per week is pure review overhead for no extra safety.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      gomod-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # SHA-pin policy: every `uses:` in .github/workflows and .github/actions is pinned to a 40-char
  # commit SHA with a trailing `# vX.Y.Z` comment (github.com/getsyntegrity/go-specs -- resolved
  # with `git ls-remote https://github.com/<owner>/<repo> refs/tags/vN refs/tags/vN^{}`, using the
  # peeled `^{}` SHA for an annotated tag), never a bare `@vN` -- a re-pointed mutable tag would
  # run inside jobs that mint the release GitHub App's installation token or read code-scanning
  # secrets. Dependabot still understands a SHA-pinned action (it resolves the new tag's SHA
  # itself) and opens a PR that bumps both the SHA and its version comment together, so the pin
  # never goes stale even though it is never a moving tag.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
