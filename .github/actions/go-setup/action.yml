name: go-setup
description: Install the pinned Go SDK and restore the build cache; local guards are
  separate.
inputs:
  cache-key:
    description: 'Which build-cache flavour this job produces: jobs that compile differently
      (plain vs -race, test binaries vs vet) must not share a key, or each run overwrites
      the others'' entries with objects they cannot reuse.'
    default: default
runs:
  using: composite
  steps:
  - name: Set up Go
    uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
    with:
      go-version-file: .go-version
      cache: false
  - name: Restore Go build cache
    uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
    with:
      path: ~/.cache/go-build
      key: go-build-${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('.go-version',
        '**/go.sum') }}-${{ github.sha }}
      restore-keys: 'go-build-${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles(''.go-version'',
        ''**/go.sum'') }}-

        '
