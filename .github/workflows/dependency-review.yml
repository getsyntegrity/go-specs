# Dependency review: block a pull request that introduces a dependency version already carrying a
# known security advisory, before it merges.
#
# This is deliberately not redundant with the repository's other three supply-chain checks, each
# of which catches a different thing:
#   - govulncheck (ci.yml) only flags a vulnerability that is actually *reachable* from this
#     repository's own code -- a vulnerable function in an unused part of a dependency doesn't
#     trip it.
#   - CodeQL (codeql.yml) scans this repository's own source for flaws; it has no visibility into
#     a dependency's advisories at all.
#   - Dependabot alerts and security updates (.github/dependabot.yml, and the repository security
#     settings enabled live 2026-09-27 -- see .github/settings.yml) open a fix PR *after* a
#     vulnerable dependency has already landed in go.mod.
# actions/dependency-review-action is the one check that runs on the PR that *adds or bumps* a
# dependency and fails it right there if the resulting version has a known advisory at or above
# the configured severity, closing the gap all three leave: it is the only one of the four that
# can stop a bad dependency version from merging in the first place.
name: Dependency review

on:
  pull_request:
    branches: [develop, main]

# contents: read only at the workflow level: the job below adds pull-requests: write itself,
# scoped to the one step that needs it (posting the failure summary as a PR comment).
permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets comment-summary-in-pr below post the failure summary as a PR comment; the action's
      # own default GITHUB_TOKEN usage needs this explicitly since the workflow-level default
      # above is read-only.
      pull-requests: write
    steps:
      # Required by actions/dependency-review-action per its own docs: it diffs the base and head
      # manifests (go.mod/go.sum here), and needs the checked-out working tree to read them from.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          # moderate and above fails the check; low-severity advisories (often not exploitable in
          # this module's actual usage) do not block a PR on their own.
          fail-on-severity: moderate
          # Only comments when there's something to flag -- a clean PR gets no extra noise.
          comment-summary-in-pr: on-failure
