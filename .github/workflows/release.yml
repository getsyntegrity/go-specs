# Economical CI policy: docs/ci-economy.md.
name: release
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.version.outputs.source }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Compute version
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Re-run: if this commit already has a tag, it is reused.
        existing=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
        if [ -n "$existing" ]; then
          { echo "version=$existing"; echo "tagged=true"; echo "source=rerun"; } >> "$GITHUB_OUTPUT"
          echo "::notice::HEAD already has $existing, reusing it"
          exit 0
        fi
        # PR that produced this commit (works with merge commits and squash). Its head branch
        # and labels are attacker-controlled text: they are only ever passed as arguments.
        pr=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
               "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
             | jq -c '[.[] | select(.merged_at != null and .base.ref == "main")][0] // {}')
        head_ref=$(jq -r '.head.ref // ""' <<<"$pr")
        labels=$(jq -r '[.labels[]?.name] | join(",")' <<<"$pr")
        echo "PR #$(jq -r '.number // "?"' <<<"$pr") from '$head_ref' labels='$labels'"
        .github/scripts/next-version.sh "$head_ref" "$labels" | tee -a "$GITHUB_OUTPUT"
        echo "tagged=false" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: .go-version
        cache-dependency-path: |-
          **/go.mod
          **/go.sum
    - name: Create tag
      if: steps.version.outputs.tagged == 'false'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$VERSION" -m "Release $VERSION"
        git push origin "$VERSION"
    - name: Release already published?
      id: published
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
                 "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")
        echo "exists=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
    - name: Release notes
      id: notes
      if: steps.published.outputs.exists == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        status=0
        .github/scripts/changelog.sh "$VERSION" --notes "$RUNNER_TEMP/release-notes.md" || status=$?
        case "$status" in
          0) echo "args=release --clean --release-notes=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT" ;;
          3) echo "::warning::No PR entry for $VERSION: using GoReleaser's generated notes"
             echo "args=release --clean" >> "$GITHUB_OUTPUT" ;;
          *) exit "$status" ;;
        esac
    - if: steps.published.outputs.exists == 'false'
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
      with:
        distribution: goreleaser
        version: ~> v2
        args: ${{ steps.notes.outputs.args }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}
  sync-develop:
    needs:
    - release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.release.outputs.version }}
        fetch-depth: 0
        token: ${{ secrets.ORG_CHECKOUT_TOKEN || github.token }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: .go-version
        cache-dependency-path: |-
          **/go.mod
          **/go.sum
    - name: Update CHANGELOG/ and open the sync PR
      env:
        GH_TOKEN: ${{ secrets.ORG_CHECKOUT_TOKEN || github.token }}
        VERSION: ${{ needs.release.outputs.version }}
        SOURCE: ${{ needs.release.outputs.source }}
      run: |
        set -euo pipefail
        branch="sync/release-$VERSION"
        # A hotfix is tagged on a commit that is not in develop: the PR is needed even when the
        # changelog has nothing to add. A develop release only needs it for the changelog. A
        # re-run or an unknown source is treated like a hotfix: an extra PR is harmless, a
        # missing one would leave a fix out of develop.
        hotfix=true
        if [ "$SOURCE" = "release" ]; then hotfix=false; fi

        git switch -q -C "$branch"
        stamped=false
        status=0
        .github/scripts/changelog.sh "$VERSION" --write || status=$?
        case "$status" in
          0) ;;
          3) echo "::notice::Nothing to add to CHANGELOG/" ;;
          *) exit "$status" ;;
        esac
        # --write also deletes CHANGELOG/unreleased-legacy.md once the first release has folded it in.
        if [ -n "$(git status --porcelain -- CHANGELOG)" ]; then
          git add -A -- CHANGELOG
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "docs: changelog $VERSION"
          stamped=true
        fi
        if [ "$stamped" = false ] && [ "$hotfix" = false ]; then
          echo "::notice::develop already has everything in $VERSION, no sync PR needed"; exit 0
        fi

        git push -q --force origin "$branch"

        open=$(gh pr list --base develop --head "$branch" --state open --json number --jq '.[0].number // empty')
        if [ -n "$open" ]; then
          echo "::notice::Sync PR #$open already open for $branch"; exit 0
        fi
        if [ "$hotfix" = true ]; then
          title="chore: sync hotfix $VERSION main into develop"
          body="Automatic PR after hotfix $VERSION: it carries the fix back into develop and adds $VERSION to CHANGELOG/. CHANGELOG/ is generated: on a conflict keep both sides' sections. Merge with a merge commit."
        else
          title="docs: changelog $VERSION"
          body="Automatic PR after release $VERSION: adds it to CHANGELOG/. Merge with a merge commit."
        fi
        url=$(gh pr create --base develop --head "$branch" --title "$title" --body "$body")
        echo "::notice::Sync PR: $url"
        gh pr edit "$url" --add-label skip-changelog --add-label kind/chore || echo "::warning::Could not set the skip-changelog and kind/chore labels"
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
