# Merge to main (from develop or hotfix/*) -> semver tag + GitHub Release, modeled on the ego
# repository's release workflow. For a Go module the tag IS the release: it is what `go get`
# resolves. GoReleaser only creates the GitHub Release (go-specs publishes no binary, see
# .goreleaser.yaml).
#
# After every release `sync-develop` opens a pull request into develop that stamps CHANGELOG.md
# (`## [Unreleased]` -> `## [vX.Y.Z] - date`) and, for a hotfix, carries the fix back down. This is
# how the branching rule "develop and main only change through pull requests" holds for bots too:
# nothing in this file pushes to either branch, it only pushes a tag and a `sync/*` branch.
#
# Version: .github/scripts/next-version.sh (release:* label on the merged PR, else hotfix/* is a
# patch and develop is a minor).
# Release notes: the CHANGELOG.md entries of `## [Unreleased]` that the previous tag did not already
# publish (.github/scripts/release-changelog.sh). See docs/CI.md.
name: release

on:
  push:
    branches: [main]
  # Re-run of a release that stopped halfway (the tag is reused). Only meaningful on main.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false   # never two releases at once, never one cut halfway

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # create the tag and the GitHub Release
      pull-requests: read    # read the PR that originated the merge
    outputs:
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.version.outputs.source }}
    steps:
      # persist-credentials stays at its default (true): "Create tag" pushes with plain
      # `git push origin`, relying on the GITHUB_TOKEN header actions/checkout configures.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Re-run: if this commit already has a tag, it is reused.
          existing=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1)
          if [ -n "$existing" ]; then
            { echo "version=$existing"; echo "tagged=true"; echo "source=rerun"; } >> "$GITHUB_OUTPUT"
            echo "::notice::HEAD already has $existing, reusing it"
            exit 0
          fi
          # PR that produced this commit (works with merge commits and squash). Its head branch
          # and labels are attacker-controlled text: they are only ever passed as arguments.
          pr=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                 "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
               | jq -c '[.[] | select(.merged_at != null and .base.ref == "main")][0] // {}')
          head_ref=$(jq -r '.head.ref // ""' <<<"$pr")
          labels=$(jq -r '[.labels[]?.name] | join(",")' <<<"$pr")
          echo "PR #$(jq -r '.number // "?"' <<<"$pr") from '$head_ref' labels='$labels'"
          .github/scripts/next-version.sh "$head_ref" "$labels" | tee -a "$GITHUB_OUTPUT"
          echo "tagged=false" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.version.outputs.tagged == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Release already published?
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
                   "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")
          echo "exists=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # A release must not build on a toolchain the repo never declared: go-setup installs the
      # one in .go-version and runs the go.mod drift check.
      - if: steps.published.outputs.exists == 'false'
        uses: ./.github/actions/go-setup
        with:
          cache-key: release

      # Notes from CHANGELOG.md. Exit 3 = no entry that the previous tag did not already publish;
      # the release is not blocked, GoReleaser falls back to its own generated git-log changelog.
      - name: Release notes
        id: notes
        if: steps.published.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous=$(git tag --merged HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                     | grep -vxF "$VERSION" | sort -V | tail -1 || true)
          status=0
          .github/scripts/release-changelog.sh "$VERSION" "${previous:--}" "$RUNNER_TEMP/CHANGELOG.stamped.md" "$RUNNER_TEMP/release-notes.md" || status=$?
          case "$status" in
            0) echo "args=release --clean --release-notes=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT" ;;
            3) echo "::warning::No new CHANGELOG.md entries since ${previous:-the beginning}: using GoReleaser's generated notes"
               echo "args=release --clean" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - if: steps.published.outputs.exists == 'false'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}

      # Black-box check from a clean consumer module, no local replace: proves
      # `go get <this repo's module path>@<tag>` resolves and builds from the tag just pushed.
      # GOPROXY=direct + GOSUMDB=off clone the tag straight from git instead of waiting on the
      # public proxy's mirror. Added after v0.1.0 shipped with a go.mod module path that did not
      # match the repository (getsyntegrity/go-specs#139).
      - name: Verify external installability of the published tag
        if: steps.published.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MODULE="$(go list -m)"
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          go mod init consumer-smoke-test
          GOPROXY=direct GOSUMDB=off go get "${MODULE}@${VERSION}"

  # develop cannot be pushed to directly, so the changelog stamp (and, after a hotfix, the fix
  # itself) go through a pull request from a disposable sync/release-vX.Y.Z branch cut from the tag.
  # ORG_CHECKOUT_TOKEN (a PAT) is optional: without it the fallback is github.token, and the PR it
  # opens will not trigger CI by itself (GitHub does not start workflows from GITHUB_TOKEN); close
  # and reopen the PR to start CI. Merge this PR with a merge commit, not a squash: a squash would
  # leave main's release commit out of develop's history.
  sync-develop:
    needs: [release]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # push the sync/* branch (when using github.token)
      pull-requests: write   # open the pull request and label it
    steps:
      # Persisted credentials on purpose: the branch push below needs them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.version }}
          fetch-depth: 0   # all the tags
          token: ${{ secrets.ORG_CHECKOUT_TOKEN || github.token }}
      - uses: ./.github/actions/go-setup
        with:
          cache-key: sync
      - name: Stamp CHANGELOG.md and open the sync PR
        env:
          GH_TOKEN: ${{ secrets.ORG_CHECKOUT_TOKEN || github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          SOURCE: ${{ needs.release.outputs.source }}
        run: |
          set -euo pipefail
          branch="sync/release-$VERSION"
          previous=$(git tag --merged HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                     | grep -vxF "$VERSION" | sort -V | tail -1 || true)
          # A hotfix is tagged on a commit that is not in develop: the PR is needed even when the
          # changelog has nothing to stamp. A develop release only needs it for the stamp. A
          # re-run or an unknown source is treated like a hotfix: an extra PR is harmless, a
          # missing one would leave a fix out of develop.
          hotfix=true
          if [ "$SOURCE" = "release" ]; then hotfix=false; fi

          git switch -q -C "$branch"
          stamped=false
          status=0
          .github/scripts/release-changelog.sh "$VERSION" "${previous:--}" "$RUNNER_TEMP/CHANGELOG.stamped.md" || status=$?
          case "$status" in
            0) cp "$RUNNER_TEMP/CHANGELOG.stamped.md" CHANGELOG.md ;;
            3) echo "::notice::Nothing to stamp in CHANGELOG.md" ;;
            *) exit "$status" ;;
          esac
          if ! git diff --quiet -- CHANGELOG.md; then
            git add CHANGELOG.md
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "docs: CHANGELOG $VERSION"
            stamped=true
          fi
          if [ "$stamped" = false ] && [ "$hotfix" = false ]; then
            echo "::notice::develop already has everything in $VERSION, no sync PR needed"; exit 0
          fi

          git push -q --force origin "$branch"

          open=$(gh pr list --base develop --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "::notice::Sync PR #$open already open for $branch"; exit 0
          fi
          if [ "$hotfix" = true ]; then
            title="chore: sync hotfix $VERSION main into develop"
            body="Automatic PR after hotfix $VERSION: it carries the fix back into develop and stamps CHANGELOG.md. Resolve any CHANGELOG.md conflict by keeping develop's \`## [Unreleased]\` above the new \`## [$VERSION]\` section. Merge with a merge commit."
          else
            title="docs: CHANGELOG $VERSION"
            body="Automatic PR after release $VERSION: stamps CHANGELOG.md. Merge with a merge commit."
          fi
          url=$(gh pr create --base develop --head "$branch" --title "$title" --body "$body")
          echo "::notice::Sync PR: $url"
          gh pr edit "$url" --add-label skip-changelog || echo "::warning::Could not set the skip-changelog label"

  notify:
    if: always()
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/notify
        with:
          status: ${{ needs.release.result }}
          title: ${{ github.event.repository.name }} ${{ needs.release.outputs.version || '(no version)' }}
          details: ${{ github.event.head_commit.message }}
          slack-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL }}
