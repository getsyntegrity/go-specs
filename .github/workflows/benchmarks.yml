# The chart-generation job that used to live here (`bench`) moved to its own file,
# benchmark-charts.yml -- see that file's header for why (loop safety: it needs a `paths-ignore`
# this workflow's `ratio-guard` job below must NOT inherit, since `paths-ignore` applies to an
# entire workflow's trigger, not to one job in it).
name: Benchmark Suite

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

# Least-privilege: ratio-guard only reads.
permissions:
  contents: read

# One in-flight run per ref, queued rather than cancelled, matching this workflow's long-standing
# concurrency policy (there's no PR head ref here to make cancellation safe the way ci.yml's is).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ratio-guard:
    # In-process baseline ratio guard (#243): compares the Runner/Describe cost against a
    # hand-written no-framework loop in the same process, same run, rather than asserting a raw
    # ns/op threshold. That reduces the effect of CPU speed, but the ratio is still not
    # machine-independent (Describe measured ~210-257x on a laptop vs ~79-115x on this runner), so
    # the bounds in benchmarks/regression_guard_test.go are calibrated for ubuntu-latest and must
    # be re-measured if the runner image changes; a local `make bench-ratio-guard` result does not
    # transfer to these bounds. See BENCHMARKS.md. Opt-in (GOSPECS_BENCH_GUARD=1 via
    # `make bench-ratio-guard`) and kept out of ci.yml/`make bench-smoke` deliberately, so it never
    # sits on the PR critical path (pull_request is not one of this workflow's triggers).
    #
    # Runs on push to develop, not just main: develop is the integration branch every feature, fix
    # and refactor lands on (CONTRIBUTING.md), and main only moves on a release/hotfix PR, so
    # main-only would leave the guard checking a branch that barely moves while regressions like
    # #235 accrue on develop commit by commit. It is its own job, in its own workflow file
    # (benchmark-charts.yml), so this more frequent trigger does not also run the expensive chart
    # generation/rolling-PR step, which stays develop-only there.
    runs-on: ubuntu-latest
    # 30 minutes, matching benchmark-charts.yml's `chart` job: this is the same repeated-sample
    # benchmark suite, run for regression comparison instead of chart generation.
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Benchmark ratio guard
        run: make bench-ratio-guard
