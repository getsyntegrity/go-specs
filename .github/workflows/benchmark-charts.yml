# Benchmark charts: regenerate benchmarks/results/*.png on every push to develop and roll the
# result into a single, reused pull request instead of committing straight to develop -- the rule
# that main and develop only change through pull requests (CONTRIBUTING.md's Branching Model)
# applies to a bot commit exactly as much as a human one.
#
# This job used to live in benchmarks.yml as `bench`, gated to push-to-main and committing the
# charts directly. Split into its own file for one reason: loop safety. Benchmark numbers differ
# on every run (this repo's ubuntu-latest shared runners are not perfectly reproducible), so
# without ignoring the chart output paths on this workflow's own trigger, merging its rolling PR
# into develop would immediately retrigger this same workflow, regenerate slightly different
# numbers, push a new commit to the PR branch, and reopen the PR -- forever. The `paths-ignore`
# below breaks that loop by never re-triggering on a push whose only change is the chart files
# themselves. `paths-ignore` applies to the whole workflow it's attached to, though, and
# benchmarks.yml's `ratio-guard` job must keep running on *every* develop push, chart-only or not
# (it is the regression guard, not decorative); the two jobs cannot share `on:` triggers with
# conflicting path filters, which is why `ratio-guard` stays in benchmarks.yml, unaffected, and
# this file exists at all.
#
# Three jobs, one concern each, chained with `needs:` since each stage's input is the previous
# stage's output: `bench` (run the suite, upload the raw text) -> `chart` (download the text,
# render PNGs, upload them) -> `publish` (download the PNGs, open/update the rolling PR). Splitting
# buys no wall time -- the chain is inherently sequential -- but it does mean the PR token is only
# read in `publish`, the one job that actually pushes anything; `bench` and `chart` never see a
# secret at all. Artifacts between jobs use a 1-day retention: nothing downstream of `publish` ever
# needs last week's intermediate benchmark text or PNGs.
name: Benchmark charts

on:
  push:
    branches: [develop]
    paths-ignore:
      - "benchmarks/results/*.png"
  workflow_dispatch:

# Least-privilege: `bench` and `chart` only read. `publish`'s only write (the rolling PR branch
# and the PR itself) goes through peter-evans/create-pull-request's `token:` input, which is
# ORG_CHECKOUT_TOKEN when the secret exists and github.token otherwise (see the step). No bot
# bypasses the branch rulesets any more: this is an ordinary pull request.
permissions:
  contents: read

# One in-flight run per ref, queued rather than cancelled: a cancelled mid-push could leave the
# rolling branch half-updated. Matches benchmarks.yml's own concurrency reasoning.
concurrency:
  group: benchmark-charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    # 30 minutes: -count=5 across the whole benchmark suite is the slowest step in this repo's
    # workflows, deliberately -- see benchmarks.yml's own reasoning for why a shared runner needs
    # repeated samples rather than a single pass.
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Benchmark numbers are only comparable across runs when the toolchain is, so this job
      # installs the same pinned version as CI rather than a floating minor.
      - name: Set up Go
        uses: ./.github/actions/go-setup
        with:
          cache-key: bench-charts

      - name: Create results directory
        run: mkdir -p benchmarks/results

      - name: Run benchmarks
        run: |
          cd benchmarks && go test . -bench=. -benchmem -count=5 -run=^$ > results/current.txt 2>&1
          cd ..

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmarks/results/current.txt
          retention-days: 1

  chart:
    needs: bench
    runs-on: ubuntu-latest
    # 10 minutes: rendering a handful of matplotlib bar charts from an already-produced text file
    # -- no Go build, no benchmark run, nothing else in this job is slow.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-results
          path: benchmarks/results

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install matplotlib
        run: pip install matplotlib

      - name: Generate charts
        run: python3 scripts/bench_to_chart.py

      - name: Upload chart images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-charts
          path: benchmarks/results/*.png
          retention-days: 1

  publish:
    needs: chart
    runs-on: ubuntu-latest
    # 20 minutes: checking out, downloading, and opening/updating one PR -- lighter than bench
    # or chart.
    timeout-minutes: 20
    # Needed only when the token falls back to github.token; a PAT carries its own scopes.
    permissions:
      contents: write        # push the chore/benchmark-charts branch
      pull-requests: write   # open or update the rolling PR and label it
    steps:
      # peter-evans/create-pull-request below commits from this working tree, so it needs one
      # checked out -- it authenticates its own push and PR with the `token:` input passed to it
      # directly, never with credentials left behind by this checkout, so nothing here needs them
      # persisted.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download chart images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-charts
          path: benchmarks/results

      # Rolls every run's regenerated charts into the same open PR (branch: below is fixed, not
      # derived per run) instead of opening a new PR every push -- Decision 3 of
      # docs/investigations/odd-tasks/hotfix-release-and-charts.md: one PR per push is noise for a
      # single maintainer, and it's this same loop-safety concern as the file header again --
      # without a single reused branch, a PR-per-push and a chart-only retrigger would compound.
      # No `[skip ci]` on the commit message (unlike the old direct-to-main commit this replaces):
      # this now becomes a real pull request, and CI must run on it like any other PR.
      - name: Open or update the rolling benchmark-charts PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # ego's token convention: the org PAT when the secret exists (so CI runs on the PR),
          # else github.token (the PR opens, but GitHub does not start workflows from it: close
          # and reopen the PR to run CI).
          token: ${{ secrets.ORG_CHECKOUT_TOKEN || github.token }}
          add-paths: benchmarks/results/*.png
          commit-message: "chore: update benchmark charts"
          branch: chore/benchmark-charts
          delete-branch: true
          base: develop
          # pr-meta exempts this branch, and the label keeps it out of the release notes.
          labels: skip-changelog,kind/chore
          title: "chore: update benchmark charts"
          body: >-
            Regenerated benchmark charts from the latest push to `develop`
            (`${{ github.sha }}`). This PR is reused across runs -- see
            `.github/workflows/benchmark-charts.yml`'s header for why -- so it always reflects
            the most recent benchmark numbers rather than accumulating one commit per push.
