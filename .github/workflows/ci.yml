# PR CI, modeled on the ego repository's. Single required check: "ci-ok" (plus "pr-meta", see
# pr-meta.yml). The Go version comes from .go-version (see go-setup); nothing here pins it by hand.
# Every job runs on its own runner, all started in parallel, so each concern is its own line in
# the PR's status list.
#
# Tests, in the docker/buildx style:
#   plan        -> are tests needed? + splits the packages into shards using real timings
#                  (.github/scripts/test-matrix.sh): regular packages go whole into TEST_SHARDS
#                  shards; a package slower than SPLIT_THRESHOLD is split by test into several
#                  shards, so one slow package cannot dominate the wall time
#   test (N)    -> each shard on its own runner, in parallel
#   test-report -> merges coverage, publishes the slowest tests, stores timings for the next run
#   race        -> `go test -race ./...` (not sharded). Merges only: push to develop or main (and
#                  manual runs), never on pull requests, so feature and hotfix PRs stay fast.
#                  The same rule applies to the race steps of modules and bench-smoke.
#   modules     -> build, vet and test of the nested module (property); race on merges only
#
# Static and release-shape checks: flow (only develop or hotfix/* may target main, and the version
# a merge to main would publish), verify (module path, gofmt, vet, build,
# release script tests), lint, tidy, api (apidiff), vuln, goreleaser (config check + snapshot
# release), dependency-review (PRs only).
#
# Go-specific jobs kept from the previous pipeline: bench-smoke (runs every benchmark once and
# race-checks the goroutine-spawning ones) and report-cli (runs the documented go-specs-report flow
# for real). See the comments on each.
#
# `push` to develop or main: validates the real result of a merge, runs the race detector (skipped
# on PRs), and on develop stores the test timings that PRs use to split the shards (caches saved
# from the default branch are visible to every PR). It replaces
# the old "no push trigger" rule (pr-gated-pipeline.md Decision 1), whose main reason was the
# release-prep commit that no longer exists.
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    # labeled/unlabeled: recomputes the version when the release:* labels change
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# A new push on the same PR supersedes the run in flight. Keyed on the PR number so every push to
# one PR shares a group; push and manual runs key on the ref.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local      # never let the go directive of a go.mod pull a different toolchain
  COVERAGE_MIN: "0"       # minimum total coverage %. 0 = report only. Raise it once there is a baseline.
  TEST_SHARDS: "2"        # parallel runners for the regular (not split) packages. 1 = no shards.
  SPLIT_THRESHOLD: "90"   # seconds. A package slower than this (by real timings) is split by test.
  SPLIT_TARGET: "90"      # seconds. Aimed duration of each shard of a split package.
  TESTFLAGS: "-timeout=20m"
  GOTESTSUM_VERSION: "v1.13.0"

jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # the release-notes preview reads the PRs merged since the last tag
    env:
      BASE: ${{ github.base_ref }}
      HEAD: ${{ github.head_ref }}
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      # Branch names are attacker-controlled: they only reach the shell through env vars.
      - name: Only develop or hotfix/* may target main
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "develop" ] && [[ "$HEAD" != hotfix/* ]]; then
            echo "::error::Only PRs from develop or hotfix/* may target main (source: $HEAD)"
            exit 1
          fi
      - if: github.base_ref == 'main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.base_ref == 'main'
        uses: ./.github/actions/go-setup
        with:
          cache-key: flow
      # Fails HERE (before the merge) if the bump cannot be published, e.g. a major without
      # updating the /vN path in go.mod. Also previews the GitHub Release notes: the same generator
      # the release runs, over the PRs merged since the previous tag, with this PR's merge commit
      # (HEAD) standing in for the tag that does not exist yet.
      - if: github.base_ref == 'main'
        name: Version to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(.github/scripts/next-version.sh "$HEAD" "$LABELS")
          echo "$out"
          v=$(sed -n 's/^version=//p' <<<"$out"); prev=$(sed -n 's/^previous=//p' <<<"$out")
          {
            echo "### Merging this PR publishes **${v}** (previous: ${prev})"
            echo
            echo "<details><summary>Release notes</summary>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          .github/scripts/changelog.sh "$v" --ref HEAD --previous "${prev:--}" --notes "$RUNNER_TEMP/notes.md" || status=$?
          case "$status" in
            0) cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY" ;;
            3) echo "::warning::No PR entry since ${prev}: the release will use GoReleaser's generated notes"
               echo "_No PR entry since the previous tag: GoReleaser's generated notes will be used._" >> "$GITHUB_STEP_SUMMARY" ;;
            *) exit "$status" ;;
          esac
          printf '\n</details>\n' >> "$GITHUB_STEP_SUMMARY"

  # Formatting is a gate, not a suggestion: gofmt output is canonical, so drift is always a
  # mechanical fix (`make fmt`). The module path check was added after a v0.1.0 that shipped with a
  # go.mod path that did not match the repository (getsyntegrity/go-specs#139).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          cache-key: vet
      - name: Verify module path matches repository
        run: |
          DECLARED="$(go list -m)"
          EXPECTED="github.com/${GITHUB_REPOSITORY}"
          if [ "$DECLARED" != "$EXPECTED" ]; then
            echo "::error::go.mod declares module '$DECLARED' but this repository is '$EXPECTED' -- external 'go get $EXPECTED' would fail." >&2
            exit 1
          fi
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # next-version.sh and changelog.sh decide what a release publishes.
      - name: Release script tests
        run: make test-ci-scripts

  # No .golangci.yml exists in this repo, so golangci-lint runs with its own defaults -- the same
  # defaults `make lint` falls into locally. Full run, not only-new-issues: the code base is clean.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false  # avoid tar "File exists" when restoring cache with toolchain files
      # Pinned to the exact golangci-lint release this repo lints with locally, so a lint pass
      # here means the same pass at a contributor's desk. Bump deliberately, together with
      # re-running `make lint` locally.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  # ── Tests ────────────────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.changes.outputs.go || 'true' }}
      matrix: ${{ steps.matrix.outputs.matrix || '{"include":[{"id":0,"packages":"./...","run":""}]}' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PRs that only touch top-level docs, docs/ or templates do not run the compile-heavy jobs.
      # They are skipped at job level: ci-ok still reports. Markdown below the top level (for
      # example tools/release/testdata) still counts as a code change because tests read it.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            go:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
      - if: steps.changes.outputs.go != 'false'
        uses: ./.github/actions/go-setup
        with:
          cache-key: plan
      - if: steps.changes.outputs.go != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test-timings
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-
      - name: Split packages into shards
        id: matrix
        if: steps.changes.outputs.go != 'false'
        run: |
          go install "gotest.tools/gotestsum@${GOTESTSUM_VERSION}"
          mkdir -p .test-timings
          echo "Timings available: $(find .test-timings -type f | wc -l) file(s)"
          matrix=$(.github/scripts/test-matrix.sh)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "### Test shards"
            echo "| Shard | Estimated | Packages | Tests |"
            echo "|---|---|---|---|"
            jq -r '.include[] | "| \(.id) | \(.estimatedRuntime) | \(.packages | split(" ") | length) | \(if .run == "" then "all" else "\(.run | split("|") | length) (split)" end) |"' <<<"$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test (shard ${{ matrix.id }})
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false            # let every shard report, like buildx
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          cache-key: test
      - run: go install "gotest.tools/gotestsum@${GOTESTSUM_VERSION}"
      - name: Tests
        env:
          PACKAGES: ${{ matrix.packages }}
          ID: ${{ matrix.id }}
          RUN: ${{ matrix.run }}   # regex of top-level tests when the package is split; empty = all
        run: |
          mkdir -p reports
          args=()
          [ -z "$RUN" ] || args+=(-run "$RUN")
          # shellcheck disable=SC2086  # PACKAGES and TESTFLAGS are space-separated lists
          gotestsum --format github-actions \
            --jsonfile "reports/test-$ID.json" --junitfile "reports/junit-$ID.xml" \
            -- $TESTFLAGS "${args[@]}" -covermode=atomic -coverprofile="reports/coverage-$ID.out" $PACKAGES
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ matrix.id }}
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  test-report:
    needs: [plan, test]
    if: ${{ !cancelled() && needs.plan.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          cache-key: report-merge
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-report-*
          path: reports
          merge-multiple: true
      - name: Coverage and slowest tests
        run: |
          go install "gotest.tools/gotestsum@${GOTESTSUM_VERSION}"
          ls reports/coverage-*.out >/dev/null 2>&1 || { echo "::error::No shard produced coverage"; exit 1; }
          # A split package has one profile per shard with the same blocks: `go tool cover` sums
          # the counts of duplicated blocks, so plain concatenation is enough.
          { echo "mode: atomic"; tail -q -n +2 reports/coverage-*.out; } > coverage.out
          go tool cover -html=coverage.out -o coverage.html
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          {
            echo "### Coverage: **${total}%** (required minimum: ${COVERAGE_MIN}%)"
            echo
            echo "### Slowest tests (> 1s)"
            echo '```'
            cat reports/test-*.json | gotestsum tool slowest --threshold 1s | head -25
            echo '```'
            echo "<details><summary>Coverage by function</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { exit !(t < m) }'; then
            echo "::error::Coverage ${total}% is below the minimum ${COVERAGE_MIN}%"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 14
      # Timings to split the shards better on the next run. Saved from develop (visible to every
      # PR) and from each PR (for its re-runs).
      - name: Save timings
        # Only this run's files: test-matrix.sh sums the package times across files.
        run: rm -rf .test-timings && mkdir -p .test-timings && cp reports/test-*.json .test-timings/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test-timings
          key: test-timings-${{ github.run_id }}

  # The race detector compiles everything instrumented, the slowest step of this file, so it is
  # its own job with its own build-cache flavour. It runs on merges (push to develop or main) and
  # manual runs only: pull requests skip it to keep feature and hotfix feedback fast, and ci-ok
  # accepts the skip.
  race:
    needs: plan
    if: needs.plan.outputs.go == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          cache-key: race
      - name: Test with race detector
        run: go test -race ./...

  # The property module is a nested Go module (property/go.mod), so `./...` at the root does not
  # reach it: each entry of the matrix is built, vetted and tested on its own. Plain `go test`
  # replays seeds and committed corpus files only and runs no fuzz campaign (that is fuzz.yml's
  # job), so it is bounded and deterministic. The race detector runs in the same job (the module is
  # small, so a separate job would only repeat the toolchain setup), on merges only, like `race`.
  modules:
    name: modules (${{ matrix.dir }})
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir:
          - property
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          cache-key: modules
      - name: Build, vet and test
        working-directory: ${{ matrix.dir }}
        run: |
          read -ra flags <<<"$TESTFLAGS"
          go build ./...
          go vet ./...
          go test "${flags[@]}" ./...
      - name: Test with race detector
        if: github.event_name != 'pull_request'
        working-directory: ${{ matrix.dir }}
        run: |
          read -ra flags <<<"$TESTFLAGS"
          go test -race "${flags[@]}" ./...

  bench-smoke:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          cache-key: bench
      # Benchmark bodies are code, and `go test ./...` skips every Benchmark function, so a panic
      # or a matcher path reachable only from a benchmark would ship green. -benchtime 1x runs each
      # benchmark exactly once: enough to execute the path, far too little to measure anything.
      # That is the point: a shared runner is noisy, so this step asserts no wall-clock threshold.
      # Allocation guarantees are gated by specs/allocation_contract_test.go in the test shards;
      # see BENCHMARKS.md for which claims are contractual.
      - name: Execute benchmark code paths
        run: make bench-smoke
      # Neither `go test -race ./...` nor `make bench-smoke` ever puts a goroutine-spawning
      # benchmark through the race detector (getsyntegrity/go-specs#218). Two groups spawn
      # goroutines, found by tracing every Benchmark* to the concurrency entry points it calls:
      # BenchmarkFalseSharing_* (specs/parallel_false_sharing_bench_test.go) and
      # BenchmarkRunner_MinimalParallel_* (benchmarks/minimal_and_buildsuite_bench_test.go). The
      # selector is scoped to them because -race adds real per-goroutine overhead; widen it if a
      # future benchmark reaches a new concurrency entry point. Merges only, like `race`.
      - name: Race-check goroutine-spawning benchmarks
        if: github.event_name != 'pull_request'
        run: go test -race -run='^$' -bench='FalseSharing|MinimalParallel' -benchtime=1x ./specs/... ./benchmarks/...

  # AC-23 of #146: docs/REPORTING.md's "Running it in CI with go-specs-report" section is not just
  # prose -- this job runs the documented GitHub Actions example for real, against the
  # report/coordination e2e fixture packages (producera, producerb), so a change that breaks the
  # documented flow fails CI.
  #
  # The `go test` step is deliberately red: GO_SPECS_FIXTURE_HOOK_FAIL=1 makes producera's
  # BeforeAll hook fail on purpose. `continue-on-error: true` on that step is what the doc's example
  # teaches: the job keeps going so `finalize` still runs against the two producers' shards,
  # proving contract v1.2.9 section 8: a reporting result is independent of the test result.
  #
  # The final assertion step replaces the doc's own "fail the job if go test failed" step: this job
  # is green only when `go test` was red AND `finalize` succeeded with the expected totals.
  report-cli:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          cache-key: report
      - name: Build go-specs-report
        run: go build -o "$RUNNER_TEMP/go-specs-report" ./cmd/go-specs-report
      # A hand-written manifest, not the repo-wide `.go-specs/producers.txt` recipe from
      # docs/REPORTING.md: this job only runs two fixture packages, and finalize's `-producers`
      # manifest must list exactly the producers a run's `go test` invocation actually covers.
      - name: Write producer manifest
        run: |
          cat > "$RUNNER_TEMP/producers.txt" <<'EOF'
          github.com/getsyntegrity/go-specs/report/coordination/internal/e2efixture/producera
          github.com/getsyntegrity/go-specs/report/coordination/internal/e2efixture/producerb
          EOF
      # init's KEY=value stdout lines append straight onto $GITHUB_ENV, so every later step
      # inherits GO_SPECS_REPORT_SHARDS/_RUN_ID/_RUN_TOKEN/_REPORT_DIR automatically.
      - name: go-specs-report init
        run: |
          "$RUNNER_TEMP/go-specs-report" init \
            -run-id="${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" \
            -report-dir="$RUNNER_TEMP/go-specs-runs" >> "$GITHUB_ENV"
      # $GITHUB_ENV is not masked automatically and the run token is a credential in everything but
      # name. Read it as a shell variable, not a `${{ env.* }}` expression: Actions prints a step's
      # script with expressions already expanded, which would log the token before the mask.
      - name: mask the run token
        run: echo "::add-mask::$GO_SPECS_RUN_TOKEN"
      - name: go test
        id: test
        continue-on-error: true
        env:
          GO_SPECS_FIXTURE_HOOK_FAIL: "1"
        run: |
          go test -count=1 \
            -coverpkg=github.com/getsyntegrity/go-specs/report/coordination/internal/e2efixture/shared \
            -coverprofile="$RUNNER_TEMP/cover.out" \
            ./report/coordination/internal/e2efixture/producera/... \
            ./report/coordination/internal/e2efixture/producerb/...
      - name: go-specs-report finalize
        id: finalize
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          "$RUNNER_TEMP/go-specs-report" finalize \
            -producers="$RUNNER_TEMP/producers.txt" \
            -coverprofile="$RUNNER_TEMP/cover.out" \
            -json="$RUNNER_TEMP/report/report.json" \
            -xml="$RUNNER_TEMP/report/report.xml" \
            -html="$RUNNER_TEMP/report/report.html" \
            -txt="$RUNNER_TEMP/report/report.txt" \
            -cleanup
      - name: upload report artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-specs-report-cli-fixture
          path: ${{ runner.temp }}/report/
      # Combine both outcomes explicitly (contract v1.2.9 section 8: neither exit code stands in
      # for the other), then check the merged report.json carries the fixture's known totals
      # (Total 4, Failed 1, Skipped 1, Passed 2 -- report/coordination/finalize_e2e_test.go) so a
      # merge regression that still exits 0 does not slip through.
      - name: assert the documented flow behaved as documented
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
        run: |
          set -u
          status=0

          if [ "$TEST_OUTCOME" != "failure" ]; then
            echo "::error::expected the go test step to fail (GO_SPECS_FIXTURE_HOOK_FAIL=1 makes producera's BeforeAll fail on purpose); got outcome=$TEST_OUTCOME" >&2
            status=1
          fi

          if [ "$FINALIZE_OUTCOME" != "success" ]; then
            echo "::error::expected go-specs-report finalize to succeed despite the red go test (contract v1.2.9 section 8: reporting and test results are independent); got outcome=$FINALIZE_OUTCOME" >&2
            status=1
          fi

          REPORT_JSON="$RUNNER_TEMP/report/report.json"
          if [ ! -f "$REPORT_JSON" ]; then
            echo "::error::$REPORT_JSON was not written by finalize" >&2
            status=1
          else
            total=$(jq -r '.execution.total' "$REPORT_JSON")
            failed=$(jq -r '.execution.failed' "$REPORT_JSON")
            skipped=$(jq -r '.execution.skipped' "$REPORT_JSON")
            passed=$(jq -r '.execution.passed' "$REPORT_JSON")
            if [ "$total" != "4" ] || [ "$failed" != "1" ] || [ "$skipped" != "1" ] || [ "$passed" != "2" ]; then
              echo "::error::report.json execution totals = total=$total failed=$failed skipped=$skipped passed=$passed, want total=4 failed=1 skipped=1 passed=2 (see report/coordination/finalize_e2e_test.go)" >&2
              status=1
            fi
          fi

          exit "$status"

  # go.mod/go.sum sorted, for the root module and every nested module (a cheap job of its own).
  tidy:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          cache-key: tidy
      - run: |
          status=0
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            (cd "$dir" && go mod tidy)
            if ! git diff --exit-code -- "$mod" "${mod%go.mod}go.sum"; then
              echo "::error::Run 'go mod tidy' in '$dir' and commit the result"
              status=1
            fi
          done < <(git ls-files 'go.mod' '**/go.mod')
          exit "$status"

  # Changes in the public API (apidiff).
  #   PR to develop: compares against develop -> informs (warning if it breaks the API).
  #   PR to main:    compares against the latest tag -> BLOCKS if it breaks the API without
  #                  release:major (api-check.sh only warns while the tag is v0.x).
  api:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ github.base_ref }}
      HEAD: ${{ github.head_ref }}
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          cache-key: api
      # Pinned to the newest golang.org/x/exp whose go.mod still declares go 1.25: later
      # revisions require go >= 1.26 and fail under the .go-version toolchain (GOTOOLCHAIN=local).
      # Revisit when .go-version moves to 1.26.
      - name: Install apidiff
        run: |
          go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260812173653-3d80eb74bc5b
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Compare API
        run: |
          if [ "$BASE" = "main" ]; then
            ref=$(git tag --merged HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [ -z "$ref" ]; then echo "First release: nothing to compare against"; exit 0; fi
            bump=$(.github/scripts/next-version.sh "$HEAD" "$LABELS" 2>/dev/null | sed -n 's/^bump=//p' || true)
            if [ -z "$bump" ]; then
              echo "::notice::Could not compute the bump (the error is in the flow job, e.g. /vN missing in go.mod). Reporting without blocking."
            fi
          else
            ref="origin/$BASE"; bump=""
          fi
          .github/scripts/api-check.sh "$ref" "$bump"

  # Fails only if the code CALLS something vulnerable. Strict mode is in security.yml. Kept on
  # go-specs' SHA-pinned action instead of `go run govulncheck@latest`.
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # repo-checkout is disabled because the step above already checked the repository out;
      # go-version-file tells the action which toolchain to build and run govulncheck with.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: .go-version
          repo-checkout: false

  # `goreleaser check` only validates the config's schema; it does not resolve `main:` build paths,
  # so it would not have caught .goreleaser.yaml pointing `builds` at an entrypoint that never
  # existed (the bug fixed in #130). Only a real `--snapshot` release attempt does, on every PR
  # instead of on the first release, where release.yml would otherwise discover it while creating
  # a real tag.
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # goreleaser needs tag history to compute the changelog
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - name: Check config
        run: goreleaser check
      - name: Dry-run release
        run: goreleaser release --snapshot --clean

  # PR-only: there is no PR diff to review on a push. `ci-ok` treats the skip as fine.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-scoped: pull-requests: write lets comment-summary-in-pr post the failure summary.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The action diffs the base and head manifests (go.mod/go.sum) from the working tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # moderate and above fails the check; low-severity advisories (often not exploitable in
          # this module's actual usage) do not block a PR on their own.
          fail-on-severity: moderate
          # Only comments when there is something to flag.
          comment-summary-in-pr: on-failure

  # The single required-check name. A new check in the future = add the job and list it here;
  # the rulesets are not touched. No `name:` on purpose: the check GitHub reports is the job id,
  # the exact string the rulesets require. `if: always()` lets it report a real pass/fail even when
  # a needed job failed; a skipped result is fine for any need.
  # !cancelled() instead of always(): when the concurrency group cancels a superseded run (for
  # example a labeled event right after a push), ci-ok is skipped instead of failing, so that
  # stale run cannot post a red required check that may land after the newer run's green one.
  # A failed or timed-out job does not cancel the workflow, so ci-ok still runs and fails then.
  ci-ok:
    if: ${{ !cancelled() }}
    needs: [flow, verify, lint, plan, test, test-report, race, modules, bench-smoke, report-cli, tidy, api, vuln, goreleaser, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
