# CI: one job per concern instead of one monolithic job, all started in
# parallel: `verify` (Go version pin, module path check, gofmt, `go vet`,
# `go build`), `unit` (`go test ./...`), `race` (`go test -race ./...`),
# `bench-smoke` (execute + race-check benchmark code paths), `report-cli`
# (the documented go-specs-report CI flow, run for real), `lint`,
# `govulncheck`, `goreleaser` (check + dry-run release), and `dependency-review`
# (PR-only, see its own comment). Each concern is its own check in the PR's
# status list instead of one line item that could fail for any of nine
# different reasons. The test jobs used to wait for `verify` (`needs:`); that
# put ~30s on every run's critical path for no correctness gain, since
# `verify` fails the run on its own either way. Every Go job restores its own
# flavour of the Go build cache (see .github/actions/setup-go/action.yml).
#
# Runs once, on the toolchain pinned in .go-version and ubuntu-latest only --
# no version/OS matrix. A matrix earning its cost needs a reason for each leg
# (an OS-specific bug class, a toolchain deprecation window); this repo never
# had one, so it was pure CI runtime with no coverage payoff. If a real reason
# shows up later (e.g. a macOS-only code path), add that leg back deliberately.
#
# `lint` (golangci-lint) and `govulncheck` run as native jobs below, in
# parallel with the rest, so neither depends on any external CI runner or
# container-based workflow tool being available.
#
# The `goreleaser` job runs `goreleaser check` and a `--snapshot` release on
# every PR targeting develop/main and every entry into the merge queue, the
# same branches release.yml tags and publishes from on a develop -> main or
# hotfix/* -> main merge. `goreleaser check` only validates the config's
# schema; it does not resolve `main:` build paths, so it would not have
# caught .goreleaser.yaml pointing `builds` at a `tools/specs-cli` entrypoint
# that never existed on develop -- the bug fixed in #130. Only a real
# `--snapshot` release attempt does, and it does so on every PR instead of on
# the first release, where release.yml would otherwise discover it while
# creating a real tag.
#
# `ci-ok` is the single stable required-check name (docs/CI.md): it needs
# every other job in this file, succeeds only when each of them succeeded or
# was skipped, and runs in seconds. A branch ruleset names `ci-ok` as its one
# required status check instead of naming every job individually, so adding,
# renaming, or removing a job here never requires a ruleset edit to keep
# merges unblocked -- docs/investigations/odd-tasks/pr-gated-pipeline.md's
# Decision 2 has the full reasoning.
#
# No `push` trigger (docs/investigations/odd-tasks/pr-gated-pipeline.md,
# Decision 1): code reaches `develop` or `main` through a pull request or a
# merge-queue entry, both already covered below, so a `push` trigger here
# would only re-run a commit `pull_request` already ran. The one exception is
# release-prep.yml's `chore(release): prepare` commit, which the release App
# pushes straight onto `develop`: release-prep.yml refuses that push unless
# the commit changes only CHANGELOG.md, and the release PR's
# `pull_request: synchronize` run validates it before it can reach `main`
# (Decision 5).
name: CI

on:
  pull_request:
    branches: [develop, main]
  merge_group:
  workflow_dispatch:

# Least-privilege default: every job below only reads the checked-out repository. `lint`,
# `govulncheck`, `verify`, `unit`, `race`, `bench-smoke`, `goreleaser`, and `dependency-review`
# never write to the repo or use a secret, so `contents: read` covers all of them and none needs
# a job-level override here beyond dependency-review's own job-scoped `pull-requests: write`.
permissions:
  contents: read

# Cancel a PR's superseded runs (a new push on the same PR obsoletes the one in flight); never
# cancel a merge-queue or manual-dispatch run, since those are the record of what actually ran
# against that exact merge-group entry or dispatch, and GitHub Actions can't retarget "superseded"
# onto them the way it can a PR's head ref. Keyed on the PR number rather than `github.ref` so
# every push to the same PR branch shares one concurrency group regardless of how the ref itself
# is spelled; falls back to `github.ref` for the non-PR triggers (merge_group, workflow_dispatch),
# which have no PR number.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Timeout policy: every job below gets an explicit timeout-minutes so a hang runs for minutes
# instead of GitHub's 6-hour default. Static/fast jobs (verify, unit, bench-smoke, govulncheck,
# dependency-review) get 10; jobs with more to compile or check (report-cli, lint) get 15; race
# gets 20, since race-instrumented compilation is the slowest step in this file (see
# .github/actions/setup-go/action.yml's own comment); goreleaser gets 25, matching a real build
# plus a --snapshot release across every configured target; ci-ok gets 5, since it only reads its
# own needs' results.
#
# Checkout policy: every checkout below sets persist-credentials: false. No job in this file
# pushes a commit, a tag or a branch, so nothing needs the credential actions/checkout would
# otherwise leave in .git/config for any later step, or tool invoked by a step, to read.
jobs:
  # All jobs start in parallel. `verify` is the fast static gate (version pin,
  # module path, formatting, vet, build); it no longer holds back `unit`,
  # `race` and `bench-smoke` with `needs:`, because waiting for it put ~30s on
  # the critical path of every run. A formatting-only failure now costs some
  # extra runner minutes (free on a public repository) instead of wall time;
  # `verify` still fails the run on its own.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Local composite actions resolve from the already-checked-out working
      # tree, so Checkout above must run first -- see
      # .github/actions/setup-go/action.yml's header for why. This step
      # installs the pinned toolchain and runs check-go-version.sh.
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: vet

      - name: Verify module path matches repository
        # go.mod's declared module path is what every external `go get` request
        # is checked against -- a mismatch (e.g. after an org/repo rename) makes
        # the module uninstallable from its real location even though it builds
        # fine locally. Caught the hard way once (getsyntegrity/go-specs#139);
        # this keeps it from recurring silently.
        run: |
          DECLARED="$(go list -m)"
          EXPECTED="github.com/${GITHUB_REPOSITORY}"
          if [ "$DECLARED" != "$EXPECTED" ]; then
            echo "::error::go.mod declares module '$DECLARED' but this repository is '$EXPECTED' -- external 'go get $EXPECTED' would fail." >&2
            exit 1
          fi

      # Formatting is a gate, not a suggestion: gofmt output is canonical, so
      # drift is always a mechanical fix (`make fmt`) and never a judgement
      # call. Running it before vet/build means `verify` reports a
      # formatting-only failure in seconds, while the test jobs run alongside.
      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Read-only structure check of CHANGELOG.md's [Unreleased] section: each Keep a Changelog
      # category at most once, in canonical order. Catching it here means release-prep.yml never
      # carries a duplicated or misordered section into a release (getsyntegrity/go-specs#326).
      - name: Validate changelog structure
        run: go run ./tools/release validate -file CHANGELOG.md

  # `go test ./...` only -- see `race` and `bench-smoke` below for the race
  # detector and benchmark-path coverage split out of the old monolithic
  # `test` job.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # See verify's Set up Go step: Checkout must run first for a local
      # composite action to resolve.
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: test

      - name: Test
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: race

      - name: Test with race detector
        run: go test -race ./...

  bench-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: bench

      # Benchmark bodies are code, and until this step they were the only code
      # in the module that CI compiled but never ran: `go test ./...` skips
      # every Benchmark function, so a panic, a nil dereference or a matcher
      # path reachable only from a benchmark shipped green. That is not
      # hypothetical -- matcher paths in this repo were, for a while, exercised
      # by benchmarks and by nothing else.
      #
      # -benchtime 1x runs each Benchmark exactly once. That is enough to
      # execute the path and far too little to measure anything, which is the
      # point: a shared GitHub runner is a noisy, shared, throttled machine, so
      # this step deliberately asserts no wall-clock threshold. It is coverage,
      # not measurement. Real numbers come from benchmarks.yml on main, where
      # -count=5 and a consistent runner make them comparable.
      #
      # Performance guarantees are gated separately, by the allocation contract
      # tests in specs/allocation_contract_test.go, which run under `go test
      # ./...` in the `unit` job above. Allocation counts are a property of the
      # generated code rather than of the machine, so they are safe to fail a
      # PR on; ns/op is not. See BENCHMARKS.md for which claims are contractual.
      #
      # Cost: about 3 seconds on top of an already-built test binary set, the
      # whole module included.
      - name: Execute benchmark code paths
        run: make bench-smoke

      # `go test -race ./...` (the `race` job above) never invokes Benchmark*
      # functions (no -bench flag, and go test's default -run skips them), and
      # `make bench-smoke` above has no -race flag -- so neither required check
      # ever puts a goroutine-spawning benchmark through the race detector
      # (getsyntegrity/go-specs#218).
      #
      # The benchmarks that actually spawn goroutines were found by tracing
      # every Benchmark* function to the concurrency entry points it calls
      # (RunParallel, RunParallelBatched, ItParallel, or an inline `go func`),
      # not by grepping benchmark source for an inline `go` statement -- that
      # grep is blind to a benchmark that reaches a goroutine indirectly
      # through a runner method. Two groups do:
      #
      #   - BenchmarkFalseSharing_* (specs/parallel_false_sharing_bench_test.go)
      #     call runParallelPadded/runParallelLocalPlain, which spawn `workers`
      #     goroutines directly (inline `go func` at :89 and :182) sharing a
      #     *[]failureRecord and *uint32.
      #   - BenchmarkRunner_MinimalParallel_* (both plain and _LargeSuite
      #     variants, in benchmarks/minimal_and_buildsuite_bench_test.go) call
      #     MinimalRunner.RunParallel/RunParallelBatched, which spawn workers
      #     at specs/minimal_runner.go:158.
      #
      # Every other Benchmark* in the module (checked by grepping every
      # `^func Benchmark` in the repo, not just files named *_bench_test.go --
      # specs/program_test.go and specs/block_runner_test.go also define
      # benchmarks -- and tracing each one's runner) drives only the
      # sequential Builder/Program Runner, MinimalRunner.Run, or BlockRunner.Run
      # paths, none of which spawn goroutines.
      #
      # Scoped to -bench='FalseSharing|MinimalParallel' across both
      # ./specs/... and ./benchmarks/... (the two packages these benchmarks
      # live in) rather than a full `-bench=. ./...` sweep: -race adds real
      # per-goroutine overhead, so racing every benchmark in the module would
      # cost more for no extra coverage. -benchtime=1x mirrors bench-smoke:
      # enough to execute the goroutines once, not a timing measurement. If a
      # future benchmark reaches a new concurrency entry point, widen this
      # selector (or the entry points above) to cover it.
      - name: Race-check goroutine-spawning benchmarks
        run: go test -race -run='^$' -bench='FalseSharing|MinimalParallel' -benchtime=1x ./specs/... ./benchmarks/...

  # lint (golangci-lint via its own provider, see the file header) runs as a
  # native job below. No .golangci.yml exists in this repo, so it runs with
  # golangci-lint's own defaults -- the same defaults `make lint` falls into
  # locally when golangci-lint is installed.
  report-cli:
    # AC-23 of #146: docs/REPORTING.md's "Running it in CI with go-specs-report" section is not
    # just prose -- this job runs the documented GitHub Actions example for real, against the
    # report/coordination e2e fixture packages (producera, producerb), so a change that breaks the
    # documented flow fails CI instead of only being caught the next time someone copy-pastes it.
    #
    # The `go test` step is deliberately red: GO_SPECS_FIXTURE_HOOK_FAIL=1 makes producera's
    # BeforeAll hook fail on purpose (report/coordination/internal/e2efixture/producera's own
    # documented failure gate, the same one report/coordination/finalize_e2e_test.go uses).
    # `continue-on-error: true` on that step is exactly what the doc's GitHub Actions example
    # teaches: it lets the job keep going so `finalize` still runs against the two producers'
    # shards, proving contract v1.2.9 §8's claim that a reporting result is independent of the test
    # result -- `go test` failing must never make `finalize` fail, and `finalize` succeeding must
    # never hide that `go test` failed.
    #
    # The final assertion step below replaces the doc's own "fail the job if go test failed"
    # consumer step: this job is green only when `go test` was red AND `finalize` succeeded with
    # the expected totals. Any other combination fails it, including a green `go test`, which would
    # mean the red-test path was never exercised.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # See verify's Set up Go step: Checkout must run first for a local
      # composite action to resolve.
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: report

      - name: Build go-specs-report
        run: go build -o "$RUNNER_TEMP/go-specs-report" ./cmd/go-specs-report

      # A hand-written manifest, not the repo-wide `.go-specs/producers.txt` recipe from
      # docs/REPORTING.md: this job only runs two fixture packages, not the whole module's
      # producers, and finalize's `-producers` manifest must list exactly the producers a run's
      # `go test` invocation actually covers.
      - name: Write producer manifest
        run: |
          cat > "$RUNNER_TEMP/producers.txt" <<'EOF'
          github.com/getsyntegrity/go-specs/report/coordination/internal/e2efixture/producera
          github.com/getsyntegrity/go-specs/report/coordination/internal/e2efixture/producerb
          EOF

      # init's KEY=value stdout lines append straight onto $GITHUB_ENV, so every later step in
      # this job inherits GO_SPECS_REPORT_SHARDS/_RUN_ID/_RUN_TOKEN/_REPORT_DIR automatically --
      # same recipe as the doc's GitHub Actions example.
      - name: go-specs-report init
        run: |
          "$RUNNER_TEMP/go-specs-report" init \
            -run-id="${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" \
            -report-dir="$RUNNER_TEMP/go-specs-runs" >> "$GITHUB_ENV"

      # $GITHUB_ENV is not masked automatically the way a declared `secrets:` value is, and the run
      # token is a credential in everything but name. Read it as a shell variable, not a
      # `${{ env.* }}` expression: Actions prints a step's script with expressions already
      # expanded, which would log the token before the mask took effect.
      - name: mask the run token
        run: echo "::add-mask::$GO_SPECS_RUN_TOKEN"

      - name: go test
        id: test
        continue-on-error: true
        env:
          GO_SPECS_FIXTURE_HOOK_FAIL: "1"
        run: |
          go test -count=1 \
            -coverpkg=github.com/getsyntegrity/go-specs/report/coordination/internal/e2efixture/shared \
            -coverprofile="$RUNNER_TEMP/cover.out" \
            ./report/coordination/internal/e2efixture/producera/... \
            ./report/coordination/internal/e2efixture/producerb/...

      - name: go-specs-report finalize
        id: finalize
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          "$RUNNER_TEMP/go-specs-report" finalize \
            -producers="$RUNNER_TEMP/producers.txt" \
            -coverprofile="$RUNNER_TEMP/cover.out" \
            -json="$RUNNER_TEMP/report/report.json" \
            -xml="$RUNNER_TEMP/report/report.xml" \
            -html="$RUNNER_TEMP/report/report.html" \
            -txt="$RUNNER_TEMP/report/report.txt" \
            -cleanup

      - name: upload report artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-specs-report-cli-fixture
          path: ${{ runner.temp }}/report/

      # Combine both outcomes explicitly, the same way docs/REPORTING.md insists a real pipeline
      # must (contract v1.2.9 §8: neither exit code stands in for the other), then check the
      # merged report.json actually carries the fixture's known totals (Total 4, Failed 1,
      # Skipped 1, Passed 2 -- report/coordination/finalize_e2e_test.go) so a merge regression that
      # still exits 0 does not slip through unnoticed.
      - name: assert the documented flow behaved as documented
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.test.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
        run: |
          set -u
          status=0

          if [ "$TEST_OUTCOME" != "failure" ]; then
            echo "::error::expected the go test step to fail (GO_SPECS_FIXTURE_HOOK_FAIL=1 makes producera's BeforeAll fail on purpose); got outcome=$TEST_OUTCOME" >&2
            status=1
          fi

          if [ "$FINALIZE_OUTCOME" != "success" ]; then
            echo "::error::expected go-specs-report finalize to succeed despite the red go test (contract v1.2.9 §8: reporting and test results are independent); got outcome=$FINALIZE_OUTCOME" >&2
            status=1
          fi

          REPORT_JSON="$RUNNER_TEMP/report/report.json"
          if [ ! -f "$REPORT_JSON" ]; then
            echo "::error::$REPORT_JSON was not written by finalize" >&2
            status=1
          else
            total=$(jq -r '.execution.total' "$REPORT_JSON")
            failed=$(jq -r '.execution.failed' "$REPORT_JSON")
            skipped=$(jq -r '.execution.skipped' "$REPORT_JSON")
            passed=$(jq -r '.execution.passed' "$REPORT_JSON")
            if [ "$total" != "4" ] || [ "$failed" != "1" ] || [ "$skipped" != "1" ] || [ "$passed" != "2" ]; then
              echo "::error::report.json execution totals = total=$total failed=$failed skipped=$skipped passed=$passed, want total=4 failed=1 skipped=1 passed=2 (see report/coordination/finalize_e2e_test.go)" >&2
              status=1
            fi
          fi

          exit "$status"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false  # avoid tar "File exists" when restoring cache with toolchain files

      # Pinned to the exact golangci-lint release this repo lints with locally
      # (`golangci-lint --version` on a contributor machine), so a lint pass here
      # means the same pass would happen at a contributor's desk, and a version-only
      # false positive/negative can't appear silently on an unpinned "latest".
      # Bump deliberately, alongside re-running `make lint` locally to catch any new
      # findings the newer linter version surfaces.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  # Scans the whole module, matching `govulncheck ./...` -- the action's default target.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # repo-checkout is disabled because the step above already checked the repository
      # out the same way every other job in this file does; go-version-file still tells
      # the action which Go toolchain to install to build and run govulncheck itself,
      # respecting the GOTOOLCHAIN=local pin like every other job.
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: .go-version
          repo-checkout: false

  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # goreleaser needs tag history to compute the changelog
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Check config
        run: goreleaser check

      - name: Dry-run release
        run: goreleaser release --snapshot --clean

  # Moved here from the now-deleted dependency-review.yml (Decision 1 of
  # docs/investigations/odd-tasks/pr-gated-pipeline.md): this workflow no longer has a `push`
  # trigger, so a job that only ever ran on `pull_request` belongs alongside the rest of this
  # file's PR-only checks rather than in a workflow of its own. `if:` keeps it a genuine no-op
  # (skipped, not failed) on the two non-PR triggers this file also has (merge_group,
  # workflow_dispatch): there is no PR diff to review on either of those, and `ci-ok` below treats
  # a skip here as fine specifically because this is the one job in the file that is expected to
  # skip sometimes.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 10 minutes: a manifest diff against the advisory database, nothing that compiles or builds.
    timeout-minutes: 10
    # Job-scoped, not covered by the workflow-level contents: read default above: pull-requests:
    # write lets comment-summary-in-pr below post the failure summary as a PR comment.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Required by actions/dependency-review-action per its own docs: it diffs the base and head
      # manifests (go.mod/go.sum here), and needs the checked-out working tree to read them from.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # moderate and above fails the check; low-severity advisories (often not exploitable in
          # this module's actual usage) do not block a PR on their own.
          fail-on-severity: moderate
          # Only comments when there's something to flag -- a clean PR gets no extra noise.
          comment-summary-in-pr: on-failure

  # The single stable required-check name (docs/CI.md, docs/investigations/odd-tasks/
  # pr-gated-pipeline.md's Decision 2): a branch ruleset names only `ci-ok`, never any job above by
  # name, so renaming a job, adding a new one, or making govulncheck's Go version pin its own
  # separate job next year never means also editing the ruleset to keep merges unblocked -- the
  # ruleset's one required check is this job, and this job's own `needs:` is the thing that grows.
  #
  # `if: always()` is what lets it run (and therefore report a real pass/fail) even when a needed
  # job failed; without it, GitHub Actions would skip `ci-ok` itself the moment any dependency
  # failed, and a skipped required check blocks a merge exactly like a failed one but with a far
  # less useful status line.
  #
  # The check below is deliberately generic (fail on `failure` or `cancelled`, not an allow-list of
  # job names) rather than special-casing dependency-review's expected skip: a `skipped` result is
  # fine for *any* need, because the only job in this file with an `if:` that can produce one is
  # dependency-review on a non-PR event (see its own comment) -- there is nothing else here that
  # skips, so no job-specific branch is needed to get that behaviour, and a future job gains the
  # same skip-tolerant treatment automatically if it ever needs a similar `if:`.
  # No `name:` on purpose: the check GitHub reports is then the job id, `ci-ok`, the exact string
  # the rulesets require -- a display name would be a second spelling to keep in sync.
  ci-ok:
    needs: [verify, unit, race, bench-smoke, report-cli, lint, govulncheck, goreleaser, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded or was skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          BAD="$(echo "$NEEDS_JSON" | jq -c '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | {job: .key, result: .value.result}]')"
          if [ "$(echo "$BAD" | jq 'length')" -gt 0 ]; then
            echo "::error::one or more required jobs did not succeed: $BAD" >&2
            exit 1
          fi
          echo "every required job succeeded or was skipped"
