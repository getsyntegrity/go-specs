# Economical CI policy: docs/ci-economy.md.
name: ci
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
      GOFLAGS: ''
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
    - name: Checkout merge tree
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Decide whether code changed
      id: plan
      run: python3 .github/scripts/ci-plan.py
    - name: Set up Go and cache
      if: steps.plan.outputs.code == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: .go-version
        cache-dependency-path: |-
          **/go.mod
          **/go.sum
    - name: Format, build and fast unit tests
      if: steps.plan.outputs.code == 'true'
      run: go run .github/scripts/ci-fast.go
    - name: Documentation only
      if: steps.plan.outputs.code == 'false'
      run: 'echo "Not applicable: documentation-only change."'
