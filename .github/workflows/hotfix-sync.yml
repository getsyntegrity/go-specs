# Hotfix sync: after a hotfix/* -> main PR merges, open (or reuse) a main -> develop PR so the
# fix lands back on develop too -- CONTRIBUTING.md's Branching Model already says a hotfix "is
# merged down into develop"; this workflow is what actually does that instead of relying on
# someone remembering to open the PR by hand. It never releases: release.yml only fires for a
# develop -> main PR's merge (Decision 2), and a hotfix branch is never named "develop", so the
# two workflows' `if:` conditions are mutually exclusive on every pull_request-closed event.
name: Hotfix sync

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    # Only a merged hotfix/* PR from this repository triggers a sync -- a closed-without-merging
    # PR, a PR from a fork, or any non-hotfix branch (including develop, which release.yml already
    # owns) all no-op.
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'hotfix/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # gh pr create needs a token with pull-requests: write, which the default GITHUB_TOKEN does
      # not have read-only permissions to satisfy here; RELEASE_TOKEN already carries Pull
      # requests (write) for release-prep.yml's own PR interactions, so it is reused rather than
      # asking the maintainer to provision a second secret for the same scope.
      - name: Verify RELEASE_TOKEN is configured
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set. Create a fine-grained personal access token scoped to this repository only, with Contents (read and write) and Pull requests (read and write) permissions, and add it as the RELEASE_TOKEN repository secret. See CONTRIBUTING.md's Releasing section." >&2
            exit 1
          fi

      # Idempotent: if an earlier hotfix already opened an unmerged main -> develop sync PR (a
      # second hotfix landed before the first sync was merged), reuse it instead of opening a
      # second one that would conflict with the first.
      - name: Open or reuse the main -> develop sync PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HOTFIX_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          EXISTING="$(gh pr list --base develop --head main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "::notice::Reusing existing open main -> develop sync PR #${EXISTING}."
            gh pr comment "$EXISTING" --body "Hotfix \`${HOTFIX_REF}\` also needs to be synced back into \`develop\` -- included in this PR."
          else
            gh pr create \
              --base develop \
              --head main \
              --title "chore: sync hotfix ${HOTFIX_REF} into develop" \
              --body "Automatic sync after \`${HOTFIX_REF}\` merged into \`main\` (CONTRIBUTING.md's Branching Model: a hotfix is merged down into \`develop\` once it ships). No release is triggered by this PR."
          fi
