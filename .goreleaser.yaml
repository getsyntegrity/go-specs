# GoReleaser config for go-specs (no binaries are built or published)
# Release runs on tag push v* (see .github/workflows/release.yml)
version: 2

project_name: go-specs

# go-specs ships as a Go module, not as binaries. Its one CLI, cmd/go-specs-report, is installed
# from the module with `go install .../cmd/go-specs-report@<version>` (docs/REPORTING.md), so no
# prebuilt binary is released.
builds:
  - skip: true

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Bug Fixes
      regexp: "^fix"
      order: 1
    - title: Other
      order: 999

release:
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
